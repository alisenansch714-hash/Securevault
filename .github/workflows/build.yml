name: Build Secure Vault APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev \
            build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.buildozer"
          yes | buildozer android update || true

      - name: Remove cached python-for-android
        run: |
          rm -rf "$HOME/.buildozer/android/platform/python-for-android"

      - name: Build APK
        run: |
          buildozer -v android debug

        uses: actions/upload-artifact@v4
        with:
          name: SecureVault-APK
          path: bin/*.apk
